[project]
name = "pinecrest"
version = "0.3.0"
description = "Pinecrest Property Management resident assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.40",
    "pinecone>=5.0",
    "langsmith>=0.1.100",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinecrest"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
